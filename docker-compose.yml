services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: nlwc-root, MYSQL_USER: nlwc, MYSQL_PASSWORD: nlwc, MYSQL_DATABASE: nlwc_ems }
    command: --log-bin-trust-function-creators=1 --character-set-server=utf8mb4
    ports: ["3308:3306"]
    volumes: [mysqldata:/var/lib/mysql]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
volumes:
  mysqldata:
  miniodata:
